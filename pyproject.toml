[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-prompt-cli"
version = "1.0.0"
description = "CLI tool for crafting, managing, and executing AI prompts across multiple LLM providers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Koketso Raphasha", email = "402106633@my.richfield.ac.za"},
]
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
]
keywords = ["ai", "llm", "cli", "prompt"]

[project.scripts]
ai-prompt = "src.main:main"
