[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-prompt-cli"
version = "1.0.0"
description = "CLI tool for sending prompts to OpenAI and Anthropic LLM providers from the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Koketso Raphasha", email = "402106633@my.richfield.ac.za"},
]
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
]
keywords = ["cli", "ai", "llm", "openai", "anthropic", "prompt"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
ai-prompt = "src.main:main"
